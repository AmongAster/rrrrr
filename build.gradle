// build.gradle — MusicVChat (musicchat), Fabric 1.21.11, Java 21
plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'com.gradleup.shadow' version '8.3.5'
    id 'java'
}

group = 'com.example.musicchat'
version = project.mod_version

base { archivesName = "musicchat-${project.minecraft_version}" }

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    // Simple Voice Chat не публикуется в доступный maven -> локальный jar (см. get-voicechat.sh)
    flatDir { dirs "$rootDir/libs" }
}

def svcJar = fileTree(dir: 'libs', include: 'voicechat-fabric-*.jar').files.find { true }
assert svcJar != null : "Put voicechat-fabric-1.21.11-2.6.27.jar into ./libs (run ./get-voicechat.sh)"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // SVC: compileOnly — аддон НЕ требует SVC для загрузки (мягкая деградация).
    // В рантайме классы api резолвятся из jar пользователя.
    compileOnly files(svcJar)

    // Audio decoders (pure-Java, relocated + nested):
    implementation('javazoom:jlayer:1.0.1')    { transitive = false } // MP3, LGPL-2.1
    implementation('org.jcraft:jorbis:0.0.17') { transitive = false } // OggVorbis, BSD-3 (зарезервировано под этап FLAC/OGG SPI)
}

// ---- Relocated libs jar -> nested in META-INF/jars ----
// НЕ используем shadowJar: он тянет classes проекта и падает на invokedynamic (looming-классы MC).
// Вместо него — чистый Copy+Relocate через Jar task с Ant-style patternset relocation невозможен,
// поэтому кладём ВЛОЖЕННЫЕ джары как есть (Fabric Loader сам изолирует их classloader'ом —
// конфликта с другими модами нет; relocation не требуется для jlayer/jorbis, т.к. их пакеты уникальны).
task libsJar(type: Jar) {
    archiveClassifier = 'libs'
    from({ project.configurations.runtimeClasspath.files.collect { zipTree(it) } }) {
        include 'javazoom/**'
        include 'org/jcraft/**'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // исключаем всё лишнее из transitive
    exclude 'META-INF/versions/**'
}

processResources {
    inputs.property 'version', project.version.toString()
    filesMatching('fabric.mod.json') {
        expand 'version': project.version.toString()
    }
}

// Кладём relocated-jar ВНУТРЬ remapJar как META-INF/jars/musicchat-libs.jar.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// jar ДОЛЖЕН быть включён — remapJar берёт build/libs/<...>-dev.jar как вход.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

afterEvaluate {
    tasks.named('remapJar') {
        dependsOn libsJar
        doLast {
            def out = archiveFile.get().asFile
            def nested = new File(buildDir, 'tmp-nested')
            nested.mkdirs()
            copy {
                from libsJar.archiveFile
                rename { 'musicchat-libs.jar' }
                into new File(nested, 'META-INF/jars')
            }
            ant.zip(destfile: out, update: true, basedir: nested)
            logger.lifecycle("Nested ${new File(nested, 'META-INF/jars/musicchat-libs.jar')} into ${out.name}")
        }
    }
}

// Проверка: в релизном джаре нет unrelocated классов библиотек
tasks.register('verifyRelocation') {
    dependsOn remapJar
    doLast {
        def out = remapJar.archiveFile.get().asFile
        def z = new java.util.zip.ZipFile(out)
        def bad = z.entries().toList().findAll { !it.directory &&
            (it.name.startsWith('javazoom/') || it.name.startsWith('org/jcraft/')) &&
            !it.name.startsWith('META-INF/jars/') }
        def hasNested = z.entries().toList().any { it.name == 'META-INF/jars/musicchat-libs.jar' }
        z.close()
        if (bad) throw new GradleException("Library classes leaked into main jar: ${bad*.name.take(10)}")
        if (!hasNested) throw new GradleException("META-INF/jars/musicchat-libs.jar missing in remapJar output")
        logger.lifecycle('verifyRelocation OK')
    }
}
build.finalizedBy verifyRelocation

